name: CD - Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Verify cluster connection
        run: kubectl get nodes

      - name: Create Kubernetes secrets
        run: |
          kubectl create secret generic infra-credentials \
            -n ecommerce \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=MONGO_INITDB_ROOT_USERNAME="${{ secrets.MONGO_INITDB_ROOT_USERNAME }}" \
            --from-literal=MONGO_INITDB_ROOT_PASSWORD="${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}" \
            --from-literal=PGADMIN_DEFAULT_EMAIL="${{ secrets.PGADMIN_DEFAULT_EMAIL }}" \
            --from-literal=PGADMIN_DEFAULT_PASSWORD="${{ secrets.PGADMIN_DEFAULT_PASSWORD }}" \
            --from-literal=KEYCLOAK_ADMIN="${{ secrets.KEYCLOAK_ADMIN }}" \
            --from-literal=KEYCLOAK_ADMIN_PASSWORD="${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -  

      - name: Apply infra manifests
        run: kubectl apply -f k8s/infra.yaml

      - name: Apply app manifests
        run: kubectl apply -f k8s/app-services.yaml

      - name: Apply monitoring manifests
        run: kubectl apply -f k8s/monitoring.yaml

      - name: Force rollout of new images
        run: |
          for svc in config-server discovery gateway customer product payment order notification; do
            kubectl rollout restart deployment/$svc -n ecommerce
          done

      - name: Wait for rollout
        run: |
          for svc in config-server discovery gateway customer product payment order notification; do
            kubectl rollout status deployment/$svc -n ecommerce --timeout=180s
          done