name: CD - Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Verify cluster connection
        run: kubectl get nodes

      - name: Apply infra manifests
        run: kubectl apply -f k8s/infra.yaml

      - name: Apply app manifests
        run: kubectl apply -f k8s/app-services.yaml

      - name: Force rollout of new images
        run: |
          for svc in config-server discovery gateway customer product payment order notification; do
            kubectl rollout restart deployment/$svc -n ecommerce
          done

      - name: Wait for rollout
        run: |
          for svc in config-server discovery gateway customer product payment order notification; do
            kubectl rollout status deployment/$svc -n ecommerce --timeout=180s
          done