name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - config-server
          - discovery
          - gateway
          - customer
          - product
          - payment
          - order
          - notification
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo
        ports:
          - 27017:27017
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests for ${{ matrix.service }}
        working-directory: ./services/${{ matrix.service }}
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: username
          SPRING_DATASOURCE_PASSWORD: password
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/testdb
        run: mvn -B test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - config-server
          - discovery
          - gateway
          - customer
          - product
          - payment
          - order
          - notification
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/swagger2898/${{ matrix.service }}:latest
            ghcr.io/swagger2898/${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Verify cluster connection
        run: kubectl get nodes

      - name: Apply infra manifests
        run: kubectl apply -f k8s/infra.yaml

      - name: Apply app manifests
        run: kubectl apply -f k8s/app-services.yaml

      - name: Force rollout of new images
        run: |
          for svc in config-server discovery gateway customer product payment order notification; do
            kubectl rollout restart deployment/$svc -n ecommerce
          done

      - name: Wait for rollout
        run: |
          for svc in config-server discovery gateway customer product payment order notification; do
            kubectl rollout status deployment/$svc -n ecommerce --timeout=180s
          done