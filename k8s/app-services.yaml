
# ---------------- config-server (no deps) ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: ecommerce
spec:
  replicas: 1
  selector: { matchLabels: { app: config-server } }
  template:
    metadata:
      labels: { app: config-server }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: config-server
          image: ghcr.io/swagger2898/config-server:latest
          imagePullPolicy: Always
          command: ["java", "-jar", "app.jar", "--spring.profiles.active=native"]
          ports: [{ containerPort: 8888 }]
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8888
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: ecommerce
spec:
  selector: { app: config-server }
  ports: [{ port: 8888, targetPort: 8888 }]
---
# ---------------- discovery (no deps) ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery
  namespace: ecommerce
spec:
  replicas: 1
  selector: { matchLabels: { app: discovery } }
  template:
    metadata:
      labels: { app: discovery }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8761"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      initContainers:
        - name: wait-for-config-server
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z config-server 8888; do echo waiting for config-server; sleep 3; done']
      containers:
        - name: discovery
          image: ghcr.io/swagger2898/discovery:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8761 }]
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8888"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: discovery
  namespace: ecommerce
spec:
  selector: { app: discovery }
  ports: [{ port: 8761, targetPort: 8761 }]
---
